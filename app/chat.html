<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title data-i18n="win.chat">跟小蟹聊两句</title>
<style>
  body { margin: 0; font: 14px/1.7 "Microsoft YaHei", "PingFang SC", sans-serif; background: #f6f1e6; color: #2f2721;
         display: flex; flex-direction: column; height: 100vh; }
  #head { padding: 9px 14px; border-bottom: 2px solid #2f2721; font-size: 12px; display: flex;
          justify-content: space-between; align-items: center; gap: 8px; }
  #head b { font-size: 14px; }
  #head span { color: #8a7f6d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  /* width: fit-content 是关键：.msg 是块级元素，不写这个就会撑满一整行，
     空气泡看起来就是一条空长条。 */
  .msg { width: fit-content; margin: 0 0 10px; padding: 8px 11px; border-radius: 10px; max-width: 86%;
         white-space: pre-wrap; word-break: break-word; }
  .me { background: #ffe9c9; margin-left: auto; }
  .ai { background: #fff; border: 2px solid #2f2721; }
  .sys { width: auto; color: #b4453a; font-size: 12px; text-align: center; }
  /* 等回复：一个小气泡里三个跳动的点 */
  .thinking { display: flex; align-items: center; gap: 5px; padding: 13px 15px; }
  .thinking i { display: block; width: 7px; height: 7px; border-radius: 50%; background: #2f2721;
                animation: hop .9s infinite ease-in-out; }
  .thinking i:nth-child(2) { animation-delay: .15s; }
  .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30%           { transform: translateY(-5px); opacity: 1; }
  }
  #bar { display: flex; gap: 8px; padding: 10px 12px; border-top: 2px solid #2f2721; }
  #in { flex: 1; font: inherit; padding: 7px 10px; border: 2px solid #2f2721; border-radius: 8px; background: #fff; }
  button { font: inherit; padding: 7px 14px; border: 2px solid #2f2721; border-radius: 8px;
           background: #ffd75e; cursor: pointer; }
  button.ghost { background: #fff; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="head"><b data-i18n="win.chat">跟小蟹聊两句</b><span id="who">…</span></div>
<div id="log"></div>
<div id="bar">
  <input id="in" data-i18n-ph="chat.ph" placeholder="说点什么…" autocomplete="off">
  <button id="send" data-i18n="chat.send">发送</button>
  <button id="stop" class="ghost" data-i18n="chat.stop" disabled>停</button>
</div>
<script src="../src/i18n.js"></script>
<script src="chat.js"></script>
</body>
</html>
